<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>声音试听台</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#253449;--accent:#216d68;--muted:#738196;--line:#dfe5ec}*{box-sizing:border-box}body{margin:0}header{padding:24px 32px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:23px;letter-spacing:-.5px;margin:0 0 5px}p{color:var(--muted);line-height:1.65;margin:5px 0;font-size:13px}header .eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:700;margin-bottom:8px}.header-tag{white-space:nowrap;color:var(--accent);background:#e8f3ef;border:1px solid #d3e8df;padding:8px 13px;border-radius:30px;font-size:12px}main{display:grid;grid-template-columns:360px minmax(0,1fr);min-height:calc(100vh - 118px)}aside{padding:24px 18px;background:#fbfcfd;border-right:1px solid var(--line)}section{padding:30px 36px;max-width:1100px;min-width:0}select,input,button{font:inherit;border:1px solid var(--line);border-radius:9px;background:#fff;color:#253449;padding:10px 12px;font-size:13px}select{width:100%;margin-bottom:10px}button{cursor:pointer;transition:background .15s,border-color .15s}button:hover{background:#edf5f2;border-color:#a8cbc4}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #7dbab0;outline-offset:2px}button.active{border-color:#7bb7a9;background:#e8f4ef;color:#14594f;box-shadow:inset 3px 0 var(--accent)}.list{height:calc(100vh - 275px);min-height:260px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}.item{overflow-wrap:anywhere;text-align:left;flex-shrink:0}.item small{display:block;color:#7a8796;margin-top:4px;font-size:10px;line-height:1.5}.badge{color:var(--accent);font-size:12px;font-weight:600}.event{font:12px ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere;line-height:1.7;padding:12px 15px;background:#edf1f4;border-radius:9px;margin:12px 0;color:#526274;border:1px solid #e2e7ec}.card{border:1px solid var(--line);background:#fff;border-radius:16px;padding:24px;margin:24px 0;box-shadow:0 3px 14px #25344904}h2{margin:9px 0;font-size:28px;letter-spacing:-.6px}canvas{width:100%;height:160px;display:block;cursor:crosshair;border-radius:8px;background:#f7faf9}#seek{width:100%;padding:0;accent-color:var(--accent);margin-top:14px}.time{display:flex;justify-content:space-between;align-items:center;font-variant-numeric:tabular-nums;margin:16px 0}#clock{font-size:25px;letter-spacing:-.5px;color:#24564f}#seconds{font-size:12px;color:var(--muted)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.primary{background:var(--accent);border-color:var(--accent);color:#fff;min-width:92px}.primary:hover{background:#185750;color:#fff}input[type=number]{width:90px}input[type=checkbox]{accent-color:var(--accent)}textarea{width:100%;background:#f8fafb;color:#526274;border:1px solid var(--line);border-radius:9px;padding:14px;font:12px/1.7 ui-monospace,monospace;margin-top:16px;resize:vertical}label{color:#617184;font-size:12px}#status{font-size:12px;min-height:24px;margin-top:16px}#filename{overflow-wrap:anywhere;font-size:11px;color:#8290a1}#cue{color:#718096;font-size:13px}details{border:1px solid var(--line);background:white;border-radius:12px;padding:12px;flex-shrink:0}summary{cursor:pointer;overflow-wrap:anywhere;font-size:13px;line-height:1.6;font-weight:600}summary small{display:block;font:10px/1.6 ui-monospace,monospace;color:#7b899a;margin:5px 0 2px;overflow-wrap:anywhere}details .item{width:100%;margin-top:7px}#search{width:100%;margin-bottom:14px;background:#fff}#count{margin-bottom:14px;color:#798697}.section-label{font-size:11px;letter-spacing:1px;font-weight:700;color:#8a97a6;margin-bottom:12px}.card-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.card-heading strong{font-size:14px}.hint{font-size:11px;color:#8592a3}@media(min-width:1450px){main{grid-template-columns:390px minmax(0,1fr)}section{padding:36px 48px}}@media(max-width:800px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.list{height:280px;min-height:0}section{padding:22px 18px}header{padding:20px}.header-tag{display:none}.time{align-items:start;gap:8px;flex-direction:column}h2{font-size:23px}}
</style>
<header><div><div class="eyebrow">AUDIO LIBRARY</div><h1>声音试听台</h1><p>按事件浏览原声，比较变体，留下你想保留的片段。</p></div><span class="header-tag">点击声音 · 播放一次</span></header>
<main><aside><div class="section-label">声音库 / LIBRARY</div><select id="group" aria-label="对象筛选"></select><input id="search" type="search" placeholder="搜索事件或文件名" aria-label="搜索事件或文件名"><div id="count" class="badge"></div><div id="list" class="list"></div></aside><section>
<div id="type" class="badge"></div><h2 id="title"></h2><div id="cue"></div><div class="event" id="event"></div><p id="filename"></p>
<div class="card"><div class="card-heading"><strong>试听与定位</strong><span class="hint">点击波形可跳转</span></div><canvas id="wave" aria-label="音频波形，点击定位"></canvas><input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="播放位置"><div class="time"><strong id="clock">00:00.00 / 00:00.00</strong><span id="seconds">0.00 / 0.00 秒</span></div>
<div class="row"><button class="primary" id="play">播放</button><button id="stop">停止 / 回到开头</button><button id="back">−0.1 秒</button><button id="forward">+0.1 秒</button><label>定位 <input id="position" type="number" min="0" step="0.01" value="0"> 秒</label></div><p id="status">正在加载声音列表…</p></div>
<div class="card"><strong>标记保留片段</strong><p>先暂停定位，再设置起点、终点。这里只试听，不改动项目音频。</p><div class="row"><button id="markA">当前时间 → 起点</button><label>起点 <input id="a" type="number" min="0" step="0.01" value="0"></label><button id="markB">当前时间 → 终点</button><label>终点 <input id="b" type="number" min="0" step="0.01" value="0"></label></div><div class="row"><button id="rangePlay">试听标记片段</button><label><input id="loop" type="checkbox"> 循环片段</label><button id="copy">复制片段说明</button></div><textarea id="note" rows="4" readonly aria-label="所选音频和片段时间"></textarea></div>
<audio id="audio" preload="auto"></audio></section></main>
<script>
const $=id=>document.getElementById(id),audio=$('audio');let items=[],selected=null,peaks=[],selectionToken=0,rangeMode=false,ctx;
const fmt=t=>{t=Math.max(0,Number(t)||0);const c=Math.round(t*100);return String(Math.floor(c/6000)).padStart(2,'0')+':'+String(Math.floor(c/100)%60).padStart(2,'0')+'.'+String(c%100).padStart(2,'0')};
const duration=()=>Number.isFinite(audio.duration)?audio.duration:0;
function note(){if(!selected)return;$('note').value=`${selected.group}${selected.team?' · '+selected.team:''}\n事件：${selected.event}\n文件：${selected.file}\n保留 ${Number($('a').value).toFixed(2)}–${Number($('b').value).toFixed(2)} 秒（原声总长 ${duration().toFixed(2)} 秒）`;draw()}
function seek(t){audio.currentTime=Math.min(duration(),Math.max(0,Number(t)||0));update()}
function update(){$('clock').textContent=fmt(audio.currentTime)+' / '+fmt(duration());$('seconds').textContent=audio.currentTime.toFixed(2)+' / '+duration().toFixed(2)+' 秒';$('seek').value=audio.currentTime;if(document.activeElement!==$('position'))$('position').value=audio.currentTime.toFixed(2);$('play').textContent=audio.paused?'播放':'暂停';draw()}
function draw(){const c=$('wave'),d=devicePixelRatio||1,w=c.clientWidth,h=160;c.width=Math.round(w*d);c.height=h*d;const g=c.getContext('2d');g.scale(d,d);g.clearRect(0,0,w,h);const total=duration()||1;const a=Number($('a').value),b=Number($('b').value);g.fillStyle='#e2f1ea';g.fillRect(a/total*w,0,(b-a)/total*w,h);g.strokeStyle='#4f9589';g.beginPath();peaks.forEach((p,i)=>{const x=i/peaks.length*w;g.moveTo(x,80-p*65);g.lineTo(x,80+p*65)});g.stroke();g.fillStyle='#87968e';g.font='11px system-ui';for(let i=0;i<=5;i++){let x=i*w/5;g.fillText((total*i/5).toFixed(2)+'s',Math.min(x,w-44),154)}g.strokeStyle='#ce8653';const x=audio.currentTime/total*w;g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke()}
const eventLabel=x=>x.event_label||x.event;
const openEvents=new Set();
function render(){const group=$('group').value;const query=$('search').value.trim().toLowerCase();const shown=items.filter(x=>(!group||x.group===group)&&(!query||[x.event,eventLabel(x),x.cue,x.file].some(t=>t.toLowerCase().includes(query))));const groups=new Map();shown.forEach(x=>{const key=x.group+'\n'+x.event;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(x)});$('count').textContent=`${groups.size} 类事件 · ${shown.length} 个声音变体`;$('list').replaceChildren();groups.forEach((variants,key)=>{const x=variants[0],box=document.createElement('details'),summary=document.createElement('summary');box.open=openEvents.has(key)||variants.some(v=>v.id===selected?.id);summary.textContent=(!group?x.group+' · ':'')+eventLabel(x)+' · '+variants.length+' 个变体';const eventCode=document.createElement('small');eventCode.textContent=x.event;summary.append(eventCode);summary.title=x.event;box.append(summary);box.ontoggle=()=>{if(box.open)openEvents.add(key);else openEvents.delete(key)};variants.forEach((v,i)=>{const b=document.createElement('button');b.className='item'+(selected?.id===v.id?' active':'');b.textContent='变体 '+(i+1)+' · '+Number(v.duration).toFixed(2)+' 秒';b.setAttribute('aria-label',eventLabel(v)+'，变体 '+(i+1)+'，'+Number(v.duration).toFixed(2)+' 秒');b.setAttribute('aria-pressed',String(selected?.id===v.id));const detail=document.createElement('small');detail.textContent=v.file;b.append(detail);b.onclick=()=>select(v,true);box.append(b)});$('list').append(box)})}

async function select(x,autoplay=false){const token=++selectionToken;audio.pause();rangeMode=false;selected=x;peaks=[];$('title').textContent=eventLabel(x);$('type').textContent=x.group+(x.team?' · '+x.team:'');$('cue').textContent='事件原声 · '+Number(x.duration).toFixed(2)+' 秒';$('event').textContent=x.event;$('filename').textContent=x.file;$('status').textContent='正在载入波形…';$('a').value=0;$('b').value=x.duration.toFixed(2);audio.loop=false;$('loop').checked=false;audio.src=x.url;audio.load();render();note();if(autoplay){audio.play().catch(e=>{if(token===selectionToken&&e.name!=='AbortError')$('status').textContent='播放未开始，请点击播放按钮：'+e.message})}try{ctx??=new (window.AudioContext||window.webkitAudioContext)();const response=await fetch(x.url);const buffer=await ctx.decodeAudioData(await response.arrayBuffer());if(token!==selectionToken)return;const channel=buffer.getChannelData(0),n=700,stride=Math.max(1,Math.floor(channel.length/n));for(let i=0;i<n;i++){let peak=0;for(let k=i*stride;k<Math.min(channel.length,(i+1)*stride);k++)peak=Math.max(peak,Math.abs(channel[k]));peaks.push(peak)}const max=Math.max(...peaks,0.001);peaks=peaks.map(p=>p/max);$('status').textContent='波形仅按显示高度缩放；播放保持素材原始响度。点击波形或拖动进度条定位。';draw()}catch(e){if(token===selectionToken)$('status').textContent='波形载入失败，仍可使用播放器：'+e.message}}
audio.onloadedmetadata=()=>{$('seek').max=duration();$('position').max=duration();$('a').max=duration();$('b').max=duration();$('b').value=duration().toFixed(2);note();update()};audio.onerror=()=>{$('status').textContent='音频加载失败，请确认本地试听服务仍在运行。'};
$('group').onchange=render;$('search').oninput=render;audio.onended=()=>{if(!rangeMode)update()};
$('play').onclick=async()=>{if(!selected)return;rangeMode=false;if(audio.paused){if(audio.currentTime>=duration())seek(0);await audio.play()}else audio.pause();update()};$('stop').onclick=()=>{audio.pause();rangeMode=false;seek(0)};$('seek').oninput=e=>{rangeMode=false;seek(e.target.value)};$('position').onchange=e=>{rangeMode=false;seek(e.target.value)};$('back').onclick=()=>seek(audio.currentTime-.1);$('forward').onclick=()=>seek(audio.currentTime+.1);$('wave').onclick=e=>{rangeMode=false;seek((e.clientX-e.currentTarget.getBoundingClientRect().left)/e.currentTarget.clientWidth*duration())};$('markA').onclick=()=>{$('a').value=audio.currentTime.toFixed(2);note()};$('markB').onclick=()=>{$('b').value=audio.currentTime.toFixed(2);note()};$('a').onchange=note;$('b').onchange=note;
$('rangePlay').onclick=async()=>{const a=Number($('a').value),b=Number($('b').value);if(a<0||b<=a||b>duration()+.006){$('status').textContent='请设置有效片段：0 ≤ 起点 < 终点 ≤ 总时长。';return}rangeMode=true;seek(a);await audio.play()};$('copy').onclick=async()=>{note();try{await navigator.clipboard.writeText($('note').value);$('status').textContent='已复制，可直接粘贴给我。'}catch{$('note').select();$('status').textContent='片段说明已选中，按 Cmd+C 复制。'}};
function tick(){if(rangeMode&&audio.currentTime>=Math.min(Number($('b').value),duration())-.004){if($('loop').checked){seek(Number($('a').value));if(audio.paused)audio.play()}else{audio.pause();seek(Number($('b').value));rangeMode=false}}update();requestAnimationFrame(tick)}
fetch('/catalog').then(r=>r.json()).then(data=>{items=data;if(!items.length){$('status').textContent='没有可试听的声音';return;}$('group').add(new Option('全部声音',''));[...new Set(items.map(x=>x.group))].forEach(g=>$('group').add(new Option(g,g)));const requested=new URLSearchParams(location.search).get('group');const first=items.find(x=>requested&&x.group===requested)||items[0];$('group').value=first.group;select(first);tick()}).catch(e=>$('status').textContent=e.message);window.onresize=draw;
</script></html>

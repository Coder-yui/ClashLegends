<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>声音试听台</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0c1320;color:#ecf2fc}*{box-sizing:border-box}body{margin:0}header{padding:25px 32px;border-bottom:1px solid #28374d}h1{font-size:25px;margin:0 0 8px}p{color:#9fb0c7;line-height:1.6;margin:5px 0}main{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 112px)}aside{padding:20px;border-right:1px solid #28374d}section{padding:28px;min-width:0}select,input,button{font:inherit;border:1px solid #394a64;border-radius:8px;background:#1b293d;color:#ecf2fc;padding:10px}select{width:100%;margin-bottom:12px}button{cursor:pointer}button:hover{background:#293e5c}button.active{border-color:#66d6cb;background:#173c41}.list{height:68vh;overflow:auto;display:flex;flex-direction:column;gap:8px}.item{overflow-wrap:anywhere;text-align:left;flex-shrink:0}.item small{display:block;color:#a8b9cf;margin-top:5px;font-size:12px;line-height:1.5}.badge{color:#66d6cb;font-size:13px}.event{font:14px ui-monospace,monospace;overflow-wrap:anywhere;line-height:1.7;padding:14px;background:#142236;border-radius:10px;margin:14px 0}.card{border:1px solid #30425d;background:#101c2d;border-radius:14px;padding:20px;margin:18px 0}h2{margin:8px 0;font-size:24px}canvas{width:100%;height:160px;display:block;cursor:crosshair}#seek{width:100%;padding:0;accent-color:#66d6cb}.time{display:flex;justify-content:space-between;align-items:center;font-variant-numeric:tabular-nums;margin:12px 0}#clock{font-size:30px;color:#8fe4db}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.primary{background:#226765;border-color:#5ebdb4}input[type=number]{width:115px}textarea{width:100%;background:#0c1523;color:#d9e8f8;border:1px solid #35455f;border-radius:8px;padding:12px;font:14px system-ui;margin-top:15px;resize:vertical}label{color:#b7c6d9}#status{font-size:13px;min-height:24px}#filename{overflow-wrap:anywhere;font-size:12px} @media(max-width:780px){main{grid-template-columns:1fr}aside{border-right:0}.list{height:240px}section{padding:18px}header{padding:20px}.time{align-items:start;gap:8px;flex-direction:column}}
</style>
<header><h1>声音试听台</h1><p>选择声音，试听、比较并标记需要保留的片段。此处不修改素材。</p></header>
<main><aside><select id="group" aria-label="对象筛选"></select><div id="count" class="badge"></div><br><div id="list" class="list"></div></aside><section>
<div id="type" class="badge"></div><h2 id="title"></h2><div id="cue"></div><div class="event" id="event"></div><p id="filename"></p>
<div class="card"><canvas id="wave" aria-label="音频波形，点击定位"></canvas><input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="播放位置"><div class="time"><strong id="clock">00:00.00 / 00:00.00</strong><span id="seconds">0.00 / 0.00 秒</span></div>
<div class="row"><button class="primary" id="play">播放</button><button id="stop">停止 / 回到开头</button><button id="back">−0.1 秒</button><button id="forward">+0.1 秒</button><label>定位 <input id="position" type="number" min="0" step="0.01" value="0"> 秒</label></div><p id="status">正在加载声音列表…</p></div>
<div class="card"><strong>标记保留片段</strong><p>先暂停定位，再设置起点、终点。这里只试听，不改动项目音频。</p><div class="row"><button id="markA">当前时间 → 起点</button><label>起点 <input id="a" type="number" min="0" step="0.01" value="0"></label><button id="markB">当前时间 → 终点</button><label>终点 <input id="b" type="number" min="0" step="0.01" value="0"></label></div><div class="row"><button id="rangePlay">试听标记片段</button><label><input id="loop" type="checkbox"> 循环片段</label><button id="copy">复制片段说明</button></div><textarea id="note" rows="4" readonly aria-label="所选音频和片段时间"></textarea></div>
<audio id="audio" preload="auto"></audio></section></main>
<script>
const $=id=>document.getElementById(id),audio=$('audio');let items=[],selected=null,peaks=[],selectionToken=0,rangeMode=false,ctx;
const fmt=t=>{t=Math.max(0,Number(t)||0);const c=Math.round(t*100);return String(Math.floor(c/6000)).padStart(2,'0')+':'+String(Math.floor(c/100)%60).padStart(2,'0')+'.'+String(c%100).padStart(2,'0')};
const duration=()=>Number.isFinite(audio.duration)?audio.duration:0;
function note(){if(!selected)return;$('note').value=`${selected.group}${selected.team?' · '+selected.team:''}\n事件：${selected.event}\n文件：${selected.file}\n保留 ${Number($('a').value).toFixed(2)}–${Number($('b').value).toFixed(2)} 秒（原声总长 ${duration().toFixed(2)} 秒）`;draw()}
function seek(t){audio.currentTime=Math.min(duration(),Math.max(0,Number(t)||0));update()}
function update(){$('clock').textContent=fmt(audio.currentTime)+' / '+fmt(duration());$('seconds').textContent=audio.currentTime.toFixed(2)+' / '+duration().toFixed(2)+' 秒';$('seek').value=audio.currentTime;if(document.activeElement!==$('position'))$('position').value=audio.currentTime.toFixed(2);$('play').textContent=audio.paused?'播放':'暂停';draw()}
function draw(){const c=$('wave'),d=devicePixelRatio||1,w=c.clientWidth,h=160;c.width=Math.round(w*d);c.height=h*d;const g=c.getContext('2d');g.scale(d,d);g.clearRect(0,0,w,h);const total=duration()||1;const a=Number($('a').value),b=Number($('b').value);g.fillStyle='#21443f';g.fillRect(a/total*w,0,(b-a)/total*w,h);g.strokeStyle='#71c5c3';g.beginPath();peaks.forEach((p,i)=>{const x=i/peaks.length*w;g.moveTo(x,80-p*65);g.lineTo(x,80+p*65)});g.stroke();g.fillStyle='#a3b5cb';g.font='11px system-ui';for(let i=0;i<=5;i++){let x=i*w/5;g.fillText((total*i/5).toFixed(2)+'s',Math.min(x,w-44),154)}g.strokeStyle='#ffcd8a';const x=audio.currentTime/total*w;g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke()}
function render(){const group=$('group').value;const shown=items.filter(x=>!group||x.group===group);$('count').textContent=`${shown.length} 个声音变体`;$('list').replaceChildren();shown.forEach(x=>{const b=document.createElement('button');b.className='item'+(selected?.id===x.id?' active':'');b.textContent=x.file;const s=document.createElement('small');s.textContent=x.cue+' · '+Number(x.duration).toFixed(2)+' 秒';b.append(s);b.onclick=()=>select(x);$('list').append(b)})}
async function select(x){const token=++selectionToken;audio.pause();rangeMode=false;selected=x;peaks=[];$('title').textContent=x.group+(x.team?' · '+x.team:'');$('type').textContent='当前试听素材';$('cue').textContent='素材标签：'+x.cue;$('event').textContent=x.event;$('filename').textContent=x.file;$('status').textContent='正在载入波形…';$('a').value=0;$('b').value=x.duration.toFixed(2);audio.src=x.url;audio.load();render();note();try{ctx??=new (window.AudioContext||window.webkitAudioContext)();const response=await fetch(x.url);const buffer=await ctx.decodeAudioData(await response.arrayBuffer());if(token!==selectionToken)return;const channel=buffer.getChannelData(0),n=700,stride=Math.max(1,Math.floor(channel.length/n));for(let i=0;i<n;i++){let peak=0;for(let k=i*stride;k<Math.min(channel.length,(i+1)*stride);k++)peak=Math.max(peak,Math.abs(channel[k]));peaks.push(peak)}const max=Math.max(...peaks,0.001);peaks=peaks.map(p=>p/max);$('status').textContent='波形仅按显示高度缩放；播放保持素材原始响度。点击波形或拖动进度条定位。';draw()}catch(e){if(token===selectionToken)$('status').textContent='波形载入失败，仍可使用播放器：'+e.message}}
audio.onloadedmetadata=()=>{$('seek').max=duration();$('position').max=duration();$('a').max=duration();$('b').max=duration();$('b').value=duration().toFixed(2);note();update()};audio.onerror=()=>{$('status').textContent='音频加载失败，请确认本地试听服务仍在运行。'};
$('group').onchange=render;$('play').onclick=async()=>{rangeMode=false;if(audio.paused){if(audio.currentTime>=duration())seek(0);await audio.play()}else audio.pause();update()};$('stop').onclick=()=>{audio.pause();rangeMode=false;seek(0)};$('seek').oninput=e=>{rangeMode=false;seek(e.target.value)};$('position').onchange=e=>{rangeMode=false;seek(e.target.value)};$('back').onclick=()=>seek(audio.currentTime-.1);$('forward').onclick=()=>seek(audio.currentTime+.1);$('wave').onclick=e=>{rangeMode=false;seek((e.clientX-e.currentTarget.getBoundingClientRect().left)/e.currentTarget.clientWidth*duration())};$('markA').onclick=()=>{$('a').value=audio.currentTime.toFixed(2);note()};$('markB').onclick=()=>{$('b').value=audio.currentTime.toFixed(2);note()};$('a').onchange=note;$('b').onchange=note;
$('rangePlay').onclick=async()=>{const a=Number($('a').value),b=Number($('b').value);if(a<0||b<=a||b>duration()+.006){$('status').textContent='请设置有效片段：0 ≤ 起点 < 终点 ≤ 总时长。';return}rangeMode=true;seek(a);await audio.play()};$('copy').onclick=async()=>{note();try{await navigator.clipboard.writeText($('note').value);$('status').textContent='已复制，可直接粘贴给我。'}catch{$('note').select();$('status').textContent='片段说明已选中，按 Cmd+C 复制。'}};
function tick(){if(rangeMode&&audio.currentTime>=Math.min(Number($('b').value),duration())-.004){if($('loop').checked){seek(Number($('a').value));if(audio.paused)audio.play()}else{audio.pause();seek(Number($('b').value));rangeMode=false}}update();requestAnimationFrame(tick)}
fetch('/catalog').then(r=>r.json()).then(data=>{items=data;if(!items.length){$('status').textContent='没有可试听的声音';return;}$('group').add(new Option('全部声音',''));[...new Set(items.map(x=>x.group))].forEach(g=>$('group').add(new Option(g,g)));const requested=new URLSearchParams(location.search).get('group');const first=items.find(x=>requested&&x.group===requested)||items[0];$('group').value=first.group;select(first);tick()}).catch(e=>$('status').textContent=e.message);window.onresize=draw;
</script></html>
